# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "development" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "Volt.sln"

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: "Development MSVC"

  BUILD_PLATFORM: 'win64'
  
  P4_DESCRIPTION: "(Fabian-Server)[Automatic Build based on commit by ${{ github.actor }}] Original Commit: ${{ github.event.head_commit.message }}"
  
permissions:
  contents: read

jobs:
  build:
    runs-on: [Windows, self-hosted]

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Run Setup
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: python ./Scripts/data/Setup.py -s s

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration="${{env.BUILD_CONFIGURATION}}" /p:Platform="${{env.BUILD_PLATFORM}}" ${{env.SOLUTION_FILE_PATH}} 

    - name: Sync VoltFPSGame Workspace To Latest Revision
      run: |
        p4 sync VoltFPSGame_Fabian-Server_main\.p4ignore
        p4 sync VoltFPSGame_Fabian-Server_main\Engine\...
        
    - name: Copy Files To VoltFPSGame Workspace 
      run: |
        Get-ChildItem -path C:\P4ROOT\actions-runner\_work\Volt\Volt\Engine -exclude Intermediate | Copy-Item -Destination C:\VoltFPSGame_Fabian-Server_main\engine -Force
        C:\Scripts\Copy-LibsWithStructure.ps1
        
    - name: Upload To VoltFPSGame Perforce
      run: |
        p4 reconcile -m -f C:\VoltFPSGame_Fabian-Server_main\engine\...        
        p4 submit -d "${{env.P4_DESCRIPTION}}"
        
